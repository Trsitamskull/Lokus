[package]
name = "lokus-audiencias"
version = "4.2.0"
description = "Gestor de Audiencias Judiciales - Sistema Profesional en Rust + Tauri"
authors = ["Jose David Bustamante Sánchez"]
edition = "2021"

[lib]
name = "lokus_audiencias_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Lokus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umya-spreadsheet = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
thiserror = "2"
base64 = "0.22"
flate2 = "1.1"
