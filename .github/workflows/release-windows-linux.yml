name: Build Lokus v3 (Windows .exe & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rust-tauri
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Desktop App & Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Lokus v__VERSION__"
          releaseBody: "Descarga directa de Lokus para Windows (Lokus.exe portable y Lokus-setup.exe con WebView2 incluido) y Linux (.AppImage, .deb, .rpm)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Adjuntar Lokus.exe portable a GitHub Releases
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v3.0.0 src-tauri/target/release/Lokus.exe --clobber

      - name: Upload Windows .exe (portable + setup con WebView2)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Lokus-Windows-exe
          path: |
            src-tauri/target/release/Lokus.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
