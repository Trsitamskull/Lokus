name: Build Lokus Android (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag del release destino (ej: v5.2.1). Si se envía, compila ese tag y adjunta al release."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tag solicitado (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: git checkout "${{ github.event.inputs.release_tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust stable (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Configurar entorno base de Android SDK y NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          CMDLINE_BIN=""
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            CMDLINE_BIN="$SDK_DIR/cmdline-tools/latest/bin"
          elif [ -d "$SDK_DIR/cmdline-tools" ]; then
            CMDLINE_BIN=$(find "$SDK_DIR/cmdline-tools" -maxdepth 2 -type d -name bin | sort -V | tail -n1 || true)
          fi
          if [ -n "$CMDLINE_BIN" ]; then
            export PATH="$CMDLINE_BIN:$PATH"
            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          fi
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Resolver NDK antes de `tauri android init` (requerido por cargo-mobile2)
          NDK_PATH=""
          if [ -d "$SDK_DIR/ndk" ]; then
            for cand in $(find "$SDK_DIR/ndk" -mindepth 1 -maxdepth 1 -type d | sort -Vr); do
              if [ -d "$cand/toolchains/llvm" ]; then
                NDK_PATH="$cand"
                break
              fi
            done
          fi
          if [ -z "$NDK_PATH" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$SDK_DIR/ndk/27.2.12479018"
          fi
          echo "NDK seleccionado: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Inicializar y configurar proyecto Android (Tauri + puente nativo Lokus)
        shell: bash
        run: |
          set -euo pipefail
          npx tauri android init --ci --skip-targets-install
          node scripts/configure-android.mjs

      - name: Instalar plataforma SDK requerida según compileSdk
        shell: bash
        run: |
          set -euo pipefail
          COMPILE_SDK=$(node scripts/configure-android.mjs --print-compile-sdk)
          echo "compileSdk detectado en Gradle: $COMPILE_SDK"

          yes | sdkmanager --licenses >/dev/null || true
          PLATFORM_PKG=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-${COMPILE_SDK}(\.[0-9]+)?" | sort -V | tail -n1 || true)
          if [ -n "$PLATFORM_PKG" ]; then
            echo "Instalando plataforma Android: $PLATFORM_PKG"
            sdkmanager --install "platform-tools" "$PLATFORM_PKG"
          else
            echo "Plataforma exacta no listada; instalando platform-tools (Gradle resolverá la plataforma automáticamente)."
            sdkmanager --install "platform-tools"
          fi

      - name: Preparar firma Android (Keystore de producción o firma instalable automática)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            KS_FILE="$RUNNER_TEMP/lokus-release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS_FILE"
            echo "LOKUS_ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Firma configurada con Keystore de producción (GitHub Secrets)."
          else
            KS_FILE="$RUNNER_TEMP/lokus-adhoc.p12"
            keytool -genkeypair -noprompt \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -alias lokus \
              -storepass lokusandroid \
              -keypass lokusandroid \
              -dname "CN=Lokus Judicial, O=Defensoria, C=CO"
            echo "LOKUS_ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEYSTORE_PASSWORD=lokusandroid" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEY_ALIAS=lokus" >> "$GITHUB_ENV"
            echo "LOKUS_ANDROID_KEY_PASSWORD=lokusandroid" >> "$GITHUB_ENV"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "Secretos de keystore no configurados: se generó firma automática para APK instalable."
          fi

      - name: Build Android (APK firmado + AAB)
        env:
          LOKUS_GOOGLE_CLIENT_ID: ${{ secrets.LOKUS_GOOGLE_CLIENT_ID_ANDROID }}
        run: npx tauri android build --target aarch64 --apk --aab --ci

      - name: Resolver versión, verificar firma y preparar artefactos
        id: vars
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));process.stdout.write(String(j.version||'').trim());")
          if [ -z "$VERSION" ]; then
            echo "No se pudo resolver la versión desde src-tauri/tauri.conf.json" >&2
            exit 1
          fi

          INPUT_TAG="${INPUT_TAG:-}"
          REF_TAG="${GITHUB_REF_NAME:-}"
          SHOULD_ATTACH="false"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            SHOULD_ATTACH="true"
          elif [[ "$REF_TAG" == v* ]]; then
            TAG="$REF_TAG"
            SHOULD_ATTACH="true"
          else
            TAG="v$VERSION"
          fi

          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*-unsigned.apk" | sort | head -n1 || true)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | sort | head -n1 || true)
          fi
          AAB_PATH=$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name "*.aab" | sort | head -n1 || true)
          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "No se encontraron artefactos Android (.apk/.aab)." >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 6 -type f | sort || true
            exit 1
          fi

          # Verificar que el APK y el AAB generados estén realmente firmados
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name "apksigner" | sort -V | tail -n1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          else
            jarsigner -verify "$APK_PATH"
          fi
          jarsigner -verify "$AAB_PATH"

          APK_OUT="Lokus_${VERSION}_android_arm64.apk"
          AAB_OUT="Lokus_${VERSION}_android_arm64.aab"
          cp "$APK_PATH" "$APK_OUT"
          cp "$AAB_PATH" "$AAB_OUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_attach=$SHOULD_ATTACH" >> "$GITHUB_OUTPUT"
          echo "apk_out=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "aab_out=$AAB_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifacts (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lokus-Android-${{ steps.vars.outputs.version }}
          path: |
            ${{ steps.vars.outputs.apk_out }}
            ${{ steps.vars.outputs.aab_out }}

      - name: Esperar release antes de subir Android
        if: steps.vars.outputs.should_attach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          for i in {1..36}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG detectado."
              exit 0
            fi
            echo "Esperando release $TAG... intento $i/36"
            sleep 10
          done
          gh release view "$TAG"

      - name: Adjuntar APK y AAB al release
        if: steps.vars.outputs.should_attach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.vars.outputs.tag }}" \
            "${{ steps.vars.outputs.apk_out }}" \
            "${{ steps.vars.outputs.aab_out }}" \
            --clobber
